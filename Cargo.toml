[package]
name = "bevy_drm_vk"
description = "Direct Rendering Manager (DRM) rendering plugin for Bevy"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["bevy_log", "bevy_window"] }
wgpu = { version = "30", default-features = false, features = ["drm"] }
drm = "0.15"
raw-window-handle = "0.6.2"

[dev-dependencies]
bevy = { version = "0.20", default-features = true }
